[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "parkinson-discovery-lab"
version = "0.5.0"
description = "Evidence-driven classical vs quantum-ready molecular ML benchmark for Parkinson's disease drug discovery"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Michael Ninh"}]
dependencies = [
  "numpy>=1.26",
  "pandas>=2.1",
  "scikit-learn>=1.4",
  "rdkit>=2024.3",
  "requests>=2.31",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "joblib>=1.3",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.6"]
kipu = ["qhub-service>=1.0"]

[project.scripts]
pdl = "parkinson_discovery.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
